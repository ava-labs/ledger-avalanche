[unstable]
build-std = ["core"]
# `panic_immediate_abort` is no longer a build-std feature: as of
# nightly-2025-12-05 it became the `immediate-abort` panic strategy, selected
# via `-Zunstable-options -Cpanic=immediate-abort` in the target rustflags below
# (core is still rebuilt through `build-std`).
target-applies-to-host = true
host-config = true

[host]
rustflags = ["-Ctarget-feature=-crt-static"]

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
rustflags = [
    "--emit",
    "asm",
    "-C",
    "relocation-model=ropi",
    "-C",
    "link-arg=-nostartfiles",
    "-C",
    "link-arg=-Tlink.ld",
    "-C",
    "llvm-args=--inline-threshold=0",
    "-Z",
    "unstable-options",
    "-C",
    "panic=immediate-abort",
]
