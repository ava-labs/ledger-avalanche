name: Lint and format 💅

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main
      - develop
      - master
      - dev

jobs:
  ledger-lint:
    uses: Zondax/_workflows/.github/workflows/_ledger_lint.yml@v3
    with:
      runs-on: ${{ github.repository_owner == 'zondax' && 'zondax-runners' || 'ubuntu-latest' }}
      check_rust: true
      # Build the rust in the new (nightly) builder, not the legacy 1.88.0 image,
      # so `-Cpanic=immediate-abort` is a valid panic strategy.
      use_latest_builder: true
